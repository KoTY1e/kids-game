<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel ⚙️</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>⚙️ Admin Dashboard</h1>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">🏠 Back to Home</button>
        </header>

        <main class="admin-grid">
            <!-- Add Question Form -->
            <section class="card">
                <h2>➕ Add New Question</h2>
                <form id="add-q-form">
                    
                    <div class="form-group">
                        <label>Audio File (MP3/WAV)</label>
                        <input type="file" id="q-audio-file" accept="audio/*" required>
                        <small class="warn">Note: Due to local storage limits, use small compressed audio files.</small>
                    </div>

                    <div class="form-group">
                        <label>Mini Game Type</label>
                        <select id="q-minigame">
                            <option value="balloonPop">Balloon Pop</option>
                            <option value="memoryCards">Memory Cards</option>
                            <option value="quickTap">Quick Tap</option>
                            <option value="findDifference">Find Difference</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Points (Difficulty)</label>
                        <select id="q-points">
                            <option value="5">Easy (5 Pts)</option>
                            <option value="10">Medium (10 Pts)</option>
                            <option value="20">Hard (20 Pts)</option>
                        </select>
                    </div>

                    <div class="answers-inputs">
                        <div class="ans-row">
                            <input type="radio" name="correct-ans" value="0" checked>
                            <input type="text" id="ans-in-0" placeholder="Answer 1" required>
                        </div>
                        <div class="ans-row">
                            <input type="radio" name="correct-ans" value="1">
                            <input type="text" id="ans-in-1" placeholder="Answer 2" required>
                        </div>
                        <div class="ans-row">
                            <input type="radio" name="correct-ans" value="2">
                            <input type="text" id="ans-in-2" placeholder="Answer 3" required>
                        </div>
                        <div class="ans-row">
                            <input type="radio" name="correct-ans" value="3">
                            <input type="text" id="ans-in-3" placeholder="Answer 4" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:20px; font-size:1.2rem; padding: 10px;">💾 Save Question</button>
                </form>
            </section>

            <!-- Question List -->
            <section class="card">
                <h2>📋 Question Bank (<span id="q-count">0</span>)</h2>
                <div id="questions-list" class="q-list">
                    <!-- Dynamic List -->
                </div>
            </section>
        </main>
    </div>

    <script src="storage.js"></script>
    <script src="admin.js"></script>
</body>
</html>
