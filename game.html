<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game On! 🚀</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="floating-shapes"></div>
    
    <!-- End Game Button -->
    <button class="btn btn-secondary end-game-btn" onclick="endGameManually()">🏁 End Game</button>

    <!-- Scoreboard (3 Teams) -->
    <header class="scoreboard">
        <div class="team-score" id="score-t1">
            <h2 id="name-t1">🦁 Lions</h2>
            <div class="points" id="pts-t1">0</div>
        </div>
        <div class="team-score" id="score-t2">
            <h2 id="name-t2">🦅 Eagles</h2>
            <div class="points" id="pts-t2">0</div>
        </div>
        <div class="team-score" id="score-t3">
            <h2 id="name-t3">🦈 Sharks</h2>
            <div class="points" id="pts-t3">0</div>
        </div>
    </header>

    <main class="game-container">
        <!-- Turn Indicator -->
        <div id="turn-indicator" class="turn-box bounce-in">
            <h2 id="turn-text">Lions Turn!</h2>
            <button class="btn btn-primary" onclick="startTurn()">▶ Start Turn</button>
        </div>

        <!-- Mini Game Area -->
        <div id="mini-game-container" class="hidden">
            <h2>Complete the Mini Game!</h2>
            <p id="mini-game-timer">Time: 20s</p>
            <div id="mini-game-canvas"></div>
        </div>

        <!-- Question Area -->
        <div id="question-container" class="hidden">
            <h2 class="animate-pulse">Listen to the question...</h2>
            
            <div class="audio-controls">
                <button class="btn-icon" onclick="togglePlay()" id="play-pause-btn">⏸️</button>
                <button class="btn-icon" onclick="replayAudio()">🔄</button>
                <input type="range" id="volume-control" min="0" max="1" step="0.1" value="1">
                <span>🔊</span>
            </div>
            <audio id="q-audio"></audio>
            
            <!-- Answers grid -->
            <div id="answers-grid" class="hidden">
                <button class="answer-btn" onclick="checkAnswer(0)" id="ans-0">Answer 1</button>
                <button class="answer-btn" onclick="checkAnswer(1)" id="ans-1">Answer 2</button>
                <button class="answer-btn" onclick="checkAnswer(2)" id="ans-2">Answer 3</button>
                <button class="answer-btn" onclick="checkAnswer(3)" id="ans-3">Answer 4</button>
            </div>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback-overlay" class="hidden">
            <div id="feedback-icon">✅</div>
            <h1 id="feedback-text">Correct! +10 Points</h1>
        </div>
    </main>

    <script src="storage.js"></script>
    <script src="miniGames.js"></script>
    <script src="game.js"></script>
</body>
</html>
